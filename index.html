<!DOCTYPE html>
<html lang="ka" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Cases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" id="brandMark">C</div>
    <div class="project-picker">
      <button id="projectBtn" class="project-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="project-name" id="projectName">…</span>
        <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="project-menu" id="projectMenu" role="listbox" hidden></div>
    </div>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="ძებნა — ID, სათაური, ტეგი, ნაბიჯი…" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
  </div>

  <div class="topbar-actions">
    <button id="expandAll" class="btn ghost" type="button">ყველას გაშლა</button>
    <button id="collapseAll" class="btn ghost" type="button">ყველას დაკეტვა</button>
    <button id="themeToggle" class="btn icon" type="button" title="Theme" aria-label="Toggle theme">
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
    </button>
  </div>
</header>

<div id="storageWarn" class="storage-warn" hidden>
  <svg viewBox="0 0 24 24"><path d="M12 9v5M12 17.5v.01"/><path d="M10.3 3.9L2.4 17.5A1.9 1.9 0 004 20.4h16a1.9 1.9 0 001.7-2.9L13.8 3.9a1.9 1.9 0 00-3.4 0z"/></svg>
  <span></span>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="stats" id="stats"></div>

    <div class="progress-box">
      <div class="progress-head">
        <span class="filters-label">შესრულება</span>
      </div>
      <div class="progress" id="progress"></div>
      <div class="progress-legend" id="progressLegend"></div>
    </div>

    <div class="filters">
      <span class="filters-label">ფილტრი</span>
      <div class="chips" id="filterChips">
        <button class="chip is-active" data-filter="all" type="button">ყველა</button>
        <button class="chip" data-filter="passed" type="button">Passed</button>
        <button class="chip" data-filter="failed" type="button">Failed</button>
        <button class="chip" data-filter="untested" type="button">Not run</button>
        <button class="chip" data-filter="smoke" type="button">Smoke</button>
      </div>
    </div>

    <nav class="tree" id="tree" aria-label="Suites"></nav>

    <div class="sidebar-add">
      <button id="addSuite" class="btn ghost wide" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> სუიტა
      </button>
      <button id="addGroup" class="btn ghost wide" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> ჯგუფი
      </button>
    </div>

    <footer class="sidebar-foot">
      <span>…</span>
      <span>DB: …</span>
    </footer>
  </aside>

  <main class="content" id="content"></main>
</div>

<div id="modalRoot"></div>

<script src="assets/js/editor.js"></script>
<script src="assets/js/overview.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
